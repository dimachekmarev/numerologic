name: Product quality
on:
  pull_request:
  push:
    branches: ['main', 'feat/numerologic-release']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend
      - run: python -m pytest backend/tests -q
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm ci
      - run: npm run build
      - run: npm run test:hosted
      - run: npx --prefix frontend playwright install --with-deps chromium
      - name: Full product browser flow
        run: python scripts-e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-browser-checks
          path: docs/screenshots
