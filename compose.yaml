services:
  app:
    build: .
    restart: unless-stopped
    env_file: backend/.env
    environment:
      DATABASE_URL: sqlite:////data/product.sqlite3
    volumes:
      - product-data:/data
    expose:
      - '8080'
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  product-data:
  caddy-data:
  caddy-config:
